[package]
name = "gpufx-mcp"
version.workspace = true
edition.workspace = true
publish = false

[features]
ffmpeg-gpl = ["gpufx-editor/ffmpeg-gpl", "d3d12-backend/ffmpeg-gpl"]

[dependencies]
engine = { path = "../engine" }
d3d12-backend = { path = "../d3d12-backend" }
gpufx-editor = { path = "../gpufx-editor" }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }

[dev-dependencies]
png = "0.18"
base64 = "0.22"
