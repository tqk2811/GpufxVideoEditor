[package]
name = "poc"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gpufx-core = { path = "../../external/FFmpegGpuFilter/crates/gpufx-core" }
# Must stay the wgpu major version gpufx-core uses (30), or the two cannot share types.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
pollster = "0.4"

# Display stack for part 2. egui-wgpu 0.37 requires wgpu 30 and egui-winit 0.37 requires winit 0.30.
egui = "0.37"
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
egui-winit = "0.37"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
# Same major version as wgpu-hal's DX12 backend, so its ID3D12Device type is ours too.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }
