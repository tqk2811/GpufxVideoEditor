[package]
name = "gpufx-render"
version.workspace = true
edition.workspace = true
publish = false

[features]
ffmpeg-gpl = ["d3d12-backend/ffmpeg-gpl"]

[dependencies]
engine = { path = "../engine" }
d3d12-backend = { path = "../d3d12-backend" }
sha2 = "0.10"
png = "0.18"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The version d3d12-backend uses; only for lowering the priority of the preview helper.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
gpufx-editor = { path = "../gpufx-editor" }
png = "0.18"
# Must stay the wgpu major version d3d12-backend uses.
wgpu = { version = "30", default-features = false, features = ["dx12"] }
