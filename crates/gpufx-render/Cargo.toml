[package]
name = "gpufx-render"
version.workspace = true
edition.workspace = true
publish = false

[features]
ffmpeg-gpl = ["d3d12-backend/ffmpeg-gpl"]

[dependencies]
engine = { path = "../engine" }
d3d12-backend = { path = "../d3d12-backend" }
sha2 = "0.10"

[dev-dependencies]
gpufx-editor = { path = "../gpufx-editor" }
# Must stay the wgpu major version d3d12-backend uses.
wgpu = { version = "30", default-features = false, features = ["dx12"] }
serde_json = "1"
