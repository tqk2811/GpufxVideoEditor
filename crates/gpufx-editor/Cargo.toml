[package]
name = "gpufx-editor"
version.workspace = true
edition.workspace = true
publish = false

[features]
ffmpeg-gpl = ["d3d12-backend/ffmpeg-gpl"]

[[test]]
name = "fake_render"
harness = false

[dependencies]
engine = { path = "../engine" }
gpufx-text = { path = "../gpufx-text" }
d3d12-backend = { path = "../d3d12-backend" }
# Must stay the wgpu major version gpufx-core uses (30), or the two cannot share types.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }

# egui-wgpu 0.37 requires wgpu 30 and egui-winit 0.37 requires winit 0.30.
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
egui-winit = "0.37"
winit = "0.30.13"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
cpal = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
