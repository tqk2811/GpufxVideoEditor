[package]
name = "d3d12-backend"
version.workspace = true
edition.workspace = true
publish = false

# Windows only: D3D12VA decoding, gpufx on a shared D3D12 device and libav encoding.
# Kept out of `engine` so the project model and the scheduler stay free of GPU and FFmpeg code.

[features]
# Link third_party/ffmpeg-gpl instead of the LGPL build. A binary built this way is distributed under the GPL.
ffmpeg-gpl = []

[dependencies]
engine = { path = "../engine" }
gpufx-text = { path = "../gpufx-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pollster = "0.4"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
gpufx-core = { path = "../../external/FFmpegGpuFilter/crates/gpufx-core" }
# Writes the built-in alpha packages, which gpufx loads from zip bytes.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Must stay the wgpu major version gpufx-core uses (30).
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }

[target.'cfg(windows)'.dependencies]
# Same major version as wgpu-hal's DX12 backend, so its ID3D12Device type is ours too.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }
