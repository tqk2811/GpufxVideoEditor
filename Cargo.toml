[workspace]
resolver = "2"
members = ["crates/poc", "crates/engine"]
# gpufx-core belongs to the workspace of its own repository (it inherits package fields from it).
exclude = ["external/FFmpegGpuFilter"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
debug = "line-tables-only"
